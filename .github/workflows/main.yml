name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install NPM
        run: npm install
        continue-on-error: true

      # BUILD NATIF
      - name: Build APK Natif
        if: hashFiles('gradlew') != ''
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      # BUILD REACT NATIVE
      - name: Build APK React Native
        if: hashFiles('android/gradlew') != ''
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Lister tous les APK créés
        run: find . -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            */outputs/apk/release/.apk
            */build/outputs/apk/release/.apk
          if-no-files-found: error
