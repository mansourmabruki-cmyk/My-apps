name: Diagnostic APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 1. Montrer la structure du projet
        run: ls -la

      - name: 2. Chercher gradlew partout
        run: find . -name "gradlew"

      - name: 3. Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Build si gradlew trouvé à la racine
        if: hashFiles('gradlew') != ''
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: 5. Build si gradlew trouvé dans android/
        if: hashFiles('android/gradlew') != ''
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: 6. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: '*/.apk'
