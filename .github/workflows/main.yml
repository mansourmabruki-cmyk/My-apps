name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # Corrigé: ubuntu-latest va devenir 26
    steps:
      - name: Checkout
        uses: actions/checkout@v5  # Corrigé: v4 -> v5

      - name: Setup Node
        uses: actions/setup-node@v5  # Corrigé: v4 -> v5
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4  # Corrigé: v3 -> v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses

      - name: Install dependencies
        run: npm install

      # POUR REACT NATIVE
      - name: Build Android Release APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
