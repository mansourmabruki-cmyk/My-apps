name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Corrigé: Node 20 est déprécié

      - name: Setup Java
        uses: actions/setup-java@v5  # Corrigé: v4 est déprécié
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true  # Seul input valide maintenant

      # On installe le SDK manuellement pour éviter le "Fetch remote"
      - name: Install Android SDK Packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          sdkmanager --licenses

      - name: Install dependencies
        run: npm install

      # POUR REACT NATIVE
      - name: Build Android Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      # POUR ANDROID NATIF, décommente cette ligne et supprime celle du dessus
      # - name: Build Android Release APK
      #   run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          # Si Android natif: path: app/build/outputs/apk/release/app-release.apk
