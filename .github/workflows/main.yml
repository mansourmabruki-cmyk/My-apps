name: Build Android

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. On utilise une action qui installe le SDK direct sans "fetch remote" lent
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          # Ça force l'acceptation des licences et évite le blocage
          accept-android-sdk-licenses: true

      # 2. Cache pour ne plus re-télécharger à chaque push
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('*/.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon
